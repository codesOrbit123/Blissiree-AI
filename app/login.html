<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151716"><title>Sign in · Blissiree</title><style>:root{font-family:Inter,ui-rounded,system-ui;color:#f8f6f1;background:#101211}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(circle at 18% 12%,#4b383230,transparent 35%),radial-gradient(circle at 82% 72%,#35544740,transparent 38%),#101211}.card{width:min(430px,calc(100% - 28px));padding:36px;border:1px solid #ffffff20;border-radius:30px;background:#ffffff0b;box-shadow:0 32px 100px #0007}.logo{width:210px;display:block;margin:0 auto 34px}.eyebrow{text-align:center;color:#d8dfb2;font-size:11px;letter-spacing:.18em;text-transform:uppercase}.card h1{text-align:center;font:500 40px/1.1 Georgia,serif;margin:14px 0 10px}.card p{text-align:center;color:#bdbbb4;line-height:1.5;margin-bottom:28px}.field{display:grid;gap:7px;margin:13px 0}.field label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#bdbbb4}.field input{width:100%;padding:14px;border-radius:13px;border:1px solid #ffffff20;background:#151816;color:#fff;font:inherit;outline:none}.field input:focus{border-color:#a7c7ba;box-shadow:0 0 0 4px #a7c7ba18}button{width:100%;margin-top:10px;border:0;border-radius:13px;background:#fff;color:#171917;padding:14px;font-weight:750;cursor:pointer}.error{min-height:22px;color:#f2aaa1;text-align:center;font-size:13px;margin-top:12px}.small{font-size:12px!important;margin:20px 0 0!important}</style></head><body><main class="card"><img class="logo" src="/assets/blissiree-logo.png" alt="Blissiree"><div class="eyebrow">Emma & Ben</div><h1>Welcome back</h1><p>Sign in to enter the private Blissiree AI experience.</p><form id="form"><div class="field"><label for="username">Username</label><input id="username" autocomplete="username" required autofocus></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><button id="submit">Sign in</button><div id="error" class="error" role="alert"></div></form><p class="small">Private Blissiree testing environment</p></main><script>form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;error.textContent='';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});const j=await r.json();if(!r.ok)throw Error(j.detail||'Unable to sign in');location.href='/'}catch(e){error.textContent=e.message;submit.disabled=false}}</script></body></html>
