# GitHub-triggered production deployment for the Teerri-owned Blissiree project.
# The service must be created and configured once before enabling this trigger.
steps:
  - name: python:3.12-slim
    entrypoint: /bin/sh
    args:
      - -c
      - |
        pip install --no-cache-dir -r app/requirements.txt
        PYTHONPATH=app python -m unittest discover -s tests -v

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/chat:$COMMIT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/chat:$COMMIT_SHA

  # `services update` changes only the image. It retains the initial service's
  # authentication, secret references, environment settings, and service account.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/chat:$COMMIT_SHA
      - --region=${_REGION}
      - --quiet

substitutions:
  _REGION: asia-southeast1
  _REPOSITORY: blissiree-ai
  _SERVICE: blissiree-gemini-chat

options:
  logging: CLOUD_LOGGING_ONLY
